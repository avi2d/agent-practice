<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как Orc ведёт задачу</title>
<style>
:root{--fg:#222;--muted:#6a6a6a;--accent:#e8590c;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1260px;margin:0 auto;padding:40px 20px 0}
.grid{display:grid;grid-template-columns:minmax(720px,1fr) 340px;gap:32px;align-items:start}
.side{position:sticky;top:20px;padding-bottom:40px}
@media (max-width:1120px){.grid{display:block}.side{position:sticky;top:auto;bottom:0;background:var(--bg);border-top:2px solid #1e1e1e;padding:4px 0 12px;max-height:45vh;overflow:auto}}
h1{font-size:32px;line-height:1.2;margin:0 0 12px}
.lead{max-width:680px;margin:0 0 24px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
#scheme{display:block;width:100%;min-width:720px;height:auto}
.hot rect{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
.hot:hover rect{stroke:#adb5bd;stroke-width:2;stroke-dasharray:6 6}
.hot:focus{outline:none}
.hot:focus-visible rect{stroke:#1971c2;stroke-width:3}
#hlr{fill:none;stroke:var(--accent);stroke-width:4;opacity:0;transition:opacity .2s ease-out}
#hl.on #hlr{opacity:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
button{font:inherit;font-size:16px;padding:8px 14px;border:2px solid #1e1e1e;border-radius:10px;background:#fff;cursor:pointer;min-height:44px;touch-action:manipulation}
button:hover{background:#f1f3f5}
button:disabled{opacity:.4;cursor:default}
#count{color:var(--muted);font-size:16px;margin-left:auto}
.card{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.card h2{font-size:22px;margin:0 0 6px}
.card p{margin:0}
@media (prefers-reduced-motion:reduce){#hlr{transition:none}}
</style></head><body><main>
<h1>Как Orc ведёт задачу</h1>

xt></g><g stroke-linecap="round"><g transform="translate(240.5 765) rotate(0 14.5 0)"><path d="M0 0 C7.34 -0.26, 13.46 -0.81, 29 0" stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(240.5 765) rotate(0 14.5 0)"><path d="M15.21 4.49 C18.96 3.33, 21.81 1.95, 29 0" stroke="#1e1e1e" stroke-width="2.5" fill="none"></path></g><g transform="translate(240.5 765) rotate(0 14.5 0)"><path d="M15.55 -5.43 C19.2 -4.41, 21.97 -3.61, 29 0" stroke="#1e1e1e" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g id="hl" aria-hidden="true"><rect id="hlr" rx="16"/></g><g id="hots"><g class="hot" data-i="0" tabindex="0" role="button" aria-label="Человек"><rect x="14" y="34" width="162" height="77" rx="14"/></g><g class="hot" data-i="1" tabindex="0" role="button" aria-label="chat"><rect x="244" y="34" width="162" height="77" rx="14"/></g><g class="hot" data-i="2" tabindex="0" role="button" aria-label="backlog"><rect x="474" y="14" width="202" height="117" rx="14"/></g><g class="hot" data-i="3" tabindex="0" role="button" aria-label="planner"><rect x="754" y="34" width="172" height="77" rx="14"/></g><g class="hot" data-i="4" tabindex="0" role="button" aria-label="beat"><rect x="474" y="204" width="202" height="77" rx="14"/></g><g class="hot" data-i="5" tabindex="0" role="button" aria-label="машина и аккаунт"><rect x="754" y="204" width="262" height="77" rx="14"/></g><g class="hot" data-i="6" tabindex="0" role="button" aria-label="run"><rect x="14" y="344" width="892" height="282" rx="14"/></g><g class="hot" data-i="7" tabindex="0" role="button" aria-label="implementer"><rect x="44" y="414" width="182" height="77" rx="14"/></g><g class="hot" data-i="8" tabindex="0" role="button" aria-label="проверки"><rect x="274" y="414" width="172" height="77" rx="14"/></g><g class="hot" data-i="9" tabindex="0" role="button" aria-label="fixer"><rect x="274" y="534" width="172" height="67" rx="14"/></g><g class="hot" data-i="10" tabindex="0" role="button" aria-label="reviewer"><rect x="494" y="414" width="172" height="77" rx="14"/></g><g class="hot" data-i="11" tabindex="0" role="button" aria-label="PR и CI"><rect x="714" y="414" width="162" height="77" rx="14"/></g><g class="hot" data-i="12" tabindex="0" role="button" aria-label="merge"><rect x="734" y="729" width="152" height="72" rx="14"/></g><g class="hot" data-i="13" tabindex="0" role="button" aria-label="attention queue"><rect x="14" y="684" width="652" height="132" rx="14"/></g><g class="hot" data-i="14" tabindex="0" role="button" aria-label="decider"><rect x="54" y="729" width="182" height="72" rx="14"/></g><g class="hot" data-i="15" tabindex="0" role="button" aria-label="Человек"><rect x="274" y="729" width="182" height="72" rx="14"/></g><g class="hot" data-i="16" tabindex="0" role="button" aria-label="dashboard и сообщения"><rect x="914" y="719" width="252" height="92" rx="14"/></g></g></svg></div>

<script>
const N=[["human", "Человек", "Я описываю работу обычными словами в одном месте, в chat. Задача, которую добавил chat, не имеет приоритета и стартует только после того, как я его дам."], ["chat", "chat", "Chat превращает мои слова в команды для backlog и ничего, кроме backlog, изменить не может. Он же сообщает мне о каждой закрытой задаче, каждом вопросе и каждом оповещении."], ["backlog", "backlog", "Backlog это единый список работы, по одному файлу Markdown на задачу. Заголовок и текст задачи становятся заданием для run, одного её выполнения. Вид задачи задаёт её итог: ship заканчивается PR, scout сдаёт отчёт и ничего не меняет, task выполняет просьбу и сдаёт отчёт с доказательствами, decision это вопрос ко мне, который заканчивается моим ответом."], ["planner", "planner", "Работу крупнее одного PR я делю на parent и дочерние задачи сам, или planner делит её в момент добавления. Итоговая проверка parent запускает весь результат в той среде, для которой он сделан, сверяет каждый критерий готовности и выносит вердикт."], ["beat", "beat", "Beat это один проход по системному таймеру раз в несколько минут, и он запускает задачи. У Orc нет демона, и каждый beat читает всё состояние с диска. Состояние задачи это папка, в которой лежит её файл, и beat переносит задачу переименованием, поэтому из двух beat её берёт только один."], ["place", "машина и аккаунт", "Среди машин с копией проекта beat берёт ту, где больше свободных мест, и пропускает машину с нагрузкой выше предела. Аккаунт он берёт у любого провайдера, где осталось больше всего лимита, и run получает провайдера и модели этого аккаунта."], ["run", "run", "Каждый run идёт в sandbox, а run задачи ship получает свой git worktree на новом branch. Модель каждой роли записана в конфигурации, и каждый шаг run записывает модель и reasoning effort, с которыми работал. В остановленном run Orc пропускает пройденные шаги, а агент продолжает прежнюю сессию на том же branch. Orc останавливает агента, который долго молчит, и ставит run на паузу с вопросом, если неудачи повторяются."], ["implementer", "implementer", "Implementer пишет изменение на сильной модели. Его модель, reasoning effort и инструменты передаёт в run файл агента для этой роли."], ["checks", "проверки", "Когда агент закончил, Orc один раз запускает локальные проверки: build, линтер и typecheck. Слово агента о готовности ничего не решает."], ["fixer", "fixer", "Fixer получает вывод проверки, которая не прошла, и исправляет изменение. После нескольких неудачных исправлений run закрывается неудачей без PR, как и задача ship, которая не изменила код."], ["reviewer", "reviewer", "Reviewer работает на сильной модели другого семейства, чем implementer. В одном режиме доставки review pipeline сам проверяет, исправляет и открывает PR, в другом reviewer записывает замечания и ничего не блокирует."], ["pr", "PR и CI", "Итог задачи ship подтверждают новый коммит на branch, пройденные локальные проверки и зелёный CI на открытом PR. Каждое из этих условий проверяет программа."], ["merge", "merge", "Orc не делает merge PR с красной проверкой, с проверкой без результата или без проверок, и делает merge ровно того коммита, который проверил. Какой зелёный PR проходит merge без меня, решают правила проекта, а критичные и рискованные операции ждут меня при любых правилах."], ["attention", "attention queue", "Всё, что кого-то ждёт, лежит по одному пункту в attention queue, и каждый пункт называет отвечающего. Run с открытым вопросом ждёт, потом встаёт на паузу на своём branch и продолжается после ответа."], ["decider", "decider", "Decider закрывает рутинные вопросы на малой модели. Он читает файл моих правил, файл инструкций проекта, задачу и прежние ответы, а критичные и рискованные операции передаёт мне по правилу из кода."], ["human2", "Человек", "До меня доходят приоритеты и критичные и рискованные операции. Любой ответ decider я могу заменить своим."], ["panel", "dashboard и сообщения", "Один dashboard показывает лимиты, машины, очереди, задачи и оповещения. Каждая ожидающая задача называет причину, и мне не нужно заходить в сессию агента, чтобы её узнать."]];let cur=-1;
const hl=document.getElementById('hl'),hlr=document.getElementById('hlr'),hots=[...document.querySelectorAll('.hot')];
function show(i){cur=i;const r=hots[i].querySelector('rect');for(const a of ['x','y','width','height'])hlr.setAttribute(a,r.getAttribute(a));hl.classList.add('on');
document.getElementById('t').textContent=N[i][1];document.getElementById('d').textContent=N[i][2];
document.getElementById('count').textContent=(i+1)+' из '+N.length;const w=document.querySelector('.wrap');if(w.scrollWidth>w.clientWidth){const hb=hots[i].getBoundingClientRect(),wb=w.getBoundingClientRect();w.scrollBy({left:hb.left+hb.width/2-(wb.left+wb.width/2),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}prev.disabled=i<=0;next.disabled=i>=N.length-1}
hots.forEach((h,i)=>{h.addEventListener('click',()=>show(i));h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
const prev=document.getElementById('prev'),next=document.getElementById('next');prev.disabled=true;
prev.onclick=()=>cur>0&&show(cur-1);next.onclick=()=>show(Math.min(cur+1,N.length-1));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
document.getElementById('count').textContent=N.length+' шагов';
</script></body></html>
