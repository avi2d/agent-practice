<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как skills доставляет инструкцию</title>
<style>
:root{--fg:#222;--muted:#6a6a6a;--accent:#e8590c;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1260px;margin:0 auto;padding:40px 20px 0}
.grid{display:grid;grid-template-columns:minmax(720px,1fr) 340px;gap:32px;align-items:start}
.side{position:sticky;top:20px;padding-bottom:40px}
@media (max-width:1120px){.grid{display:block}.side{position:sticky;top:auto;bottom:0;background:var(--bg);border-top:2px solid #1e1e1e;padding:4px 0 12px;max-height:45vh;overflow:auto}}
h1{font-size:32px;line-height:1.2;margin:0 0 12px}
.lead{max-width:680px;margin:0 0 24px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
#scheme{display:block;width:100%;min-width:720px;height:auto}
.hot rect{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
.hot:hover rect{stroke:#adb5bd;stroke-width:2;stroke-dasharray:6 6}
.hot:focus{outline:none}
.hot:focus-visible rect{stroke:#1971c2;stroke-width:3}
#hlr{fill:none;stroke:var(--accent);stroke-width:4;opacity:0;transition:opacity .2s ease-out}
#hl.on #hlr{opacity:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
button{font:inherit;font-size:16px;padding:8px 14px;border:2px solid #1e1e1e;border-radius:10px;background:#fff;cursor:pointer;min-height:44px;touch-action:manipulation}
button:hover{background:#f1f3f5}
button:disabled{opacity:.4;cursor:default}
#count{color:var(--muted);font-size:16px;margin-left:auto}
.card{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.card h2{font-size:22px;margin:0 0 6px}
.card p{margin:0}
@media (prefers-reduced-motion:reduce){#hlr{transition:none}}
</style></head><body><main>
<h1>Как skills доставляет инструкцию</h1>
<p class="lead">Это путь одной инструкции через skills, мою библиотеку инструкций для агентов, от Body до модели. Нажмите на любой элемент схемы или пройдите путь по шагам.</p>

<section class="card" aria-live="polite"><h2 id="t">С чего начать</h2><p id="d">Нажмите «Дальше», и схема поведёт инструкцию от первого шага.</p></section></div></div>

<script>
const N=[["body","Body","Body это одна инструкция: папка с файлом в открытом формате SKILL.md. Каждая инструкция лежит одним файлом, а её вид, Rule, Skill или Reference, задаёт, как она запускается."],["index","dispatch index","Генерация копирует в dispatch index текст каждого Rule и его условие. Поэтому правка Rule доходит до новой сессии только после генерации."],["dispatcher","Dispatcher","Dispatcher в каждой среде запуска проверяет условие Rule, например тип изменённого файла. Модель не решает, нужно ли правило."],["conversation","разговор","Rule приходит в разговор сообщением при каждом вызове модели, а не в системный промпт. Dispatcher сверяет, что передал ровно то, что записал, и называет по имени Rule, который не дошёл."],["model","модель","Модель получает Rule без выбора, читать ли его. Skill она получает, когда его вызывает человек, а Reference читает по имени."],["log","лог решений","Dispatcher записывает в лог каждое своё решение: Rule вставлен, передан в разговор или назван причиной отказа. Rule, который тихо выключился, виден в логе."],["hub","Hub со ссылками","Hub это плоский каталог ссылок на Skill и Reference без копий текста. Rule в нём нет, потому что Rule срабатывает по условию и не занимает место в каждой сессии. Правка Skill или Reference видна сразу."],["compare","сравнение","Rule проходит ту же задачу с правилом и без него, и вердикт выносит программа. Запись каждого сравнения хранится в библиотеке."]];let cur=-1;
const hl=document.getElementById('hl'),hlr=document.getElementById('hlr'),hots=[...document.querySelectorAll('.hot')];
function show(i){cur=i;const r=hots[i].querySelector('rect');for(const a of ['x','y','width','height'])hlr.setAttribute(a,r.getAttribute(a));hl.classList.add('on');
document.getElementById('t').textContent=N[i][1];document.getElementById('d').textContent=N[i][2];
document.getElementById('count').textContent=(i+1)+' из '+N.length;const w=document.querySelector('.wrap');if(w.scrollWidth>w.clientWidth){const hb=hots[i].getBoundingClientRect(),wb=w.getBoundingClientRect();w.scrollBy({left:hb.left+hb.width/2-(wb.left+wb.width/2),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}prev.disabled=i<=0;next.disabled=i>=N.length-1}
hots.forEach((h,i)=>{h.addEventListener('click',()=>show(i));h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
const prev=document.getElementById('prev'),next=document.getElementById('next');prev.disabled=true;
prev.onclick=()=>cur>0&&show(cur-1);next.onclick=()=>show(Math.min(cur+1,N.length-1));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
document.getElementById('count').textContent=N.length+' шагов';
</script></body></html>
