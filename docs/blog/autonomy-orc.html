<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каким будет Orc</title>
<style>
:root{--fg:#222;--muted:#6a6a6a;--accent:#e8590c;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1260px;margin:0 auto;padding:40px 20px 0}
.grid{display:grid;grid-template-columns:minmax(720px,1fr) 340px;gap:32px;align-items:start}
.side{position:sticky;top:20px;padding-bottom:40px}
@media (max-width:1120px){.grid{display:block}.side{position:sticky;top:auto;bottom:0;background:var(--bg);border-top:2px solid #1e1e1e;padding:4px 0 12px;max-height:45vh;overflow:auto}}
h1{font-size:32px;line-height:1.2;margin:0 0 12px}
.lead{max-width:680px;margin:0 0 24px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
#scheme{display:block;width:100%;min-width:720px;height:auto}
.hot rect{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
.hot:hover rect{stroke:#adb5bd;stroke-width:2;stroke-dasharray:6 6}
.hot:focus{outline:none}
.hot:focus-visible rect{stroke:#1971c2;stroke-width:3}
#hlr{fill:none;stroke:var(--accent);stroke-width:4;opacity:0;transition:opacity .2s ease-out}
#hl.on #hlr{opacity:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
button{font:inherit;font-size:16px;padding:8px 14px;border:2px solid #1e1e1e;border-radius:10px;background:#fff;cursor:pointer;min-height:44px;touch-action:manipulation}
button:hover{background:#f1f3f5}
button:disabled{opacity:.4;cursor:default}
#count{color:var(--muted);font-size:16px;margin-left:auto}
.card{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.card h2{font-size:22px;margin:0 0 6px}
.card p{margin:0}
@media (prefers-reduced-motion:reduce){#hlr{transition:none}}
</style></head><body><main>
<h1>Каким будет Orc</h1>
<p class="lead">Это путь одной задачи в Orc, каким он должен стать: что Orc выберет сам, где агент будет работать без запросов разрешения и что дойдёт до человека. Нажмите на любой элемент схемы или пройдите путь по шагам.</p>

<script>
const N=[["human","Человек","Человек опишет задачу словами. Машину, модель и reasoning effort он выбирать не будет."],["backlog","backlog","Задача попадёт в backlog, единый список работы, и станет заданием агента дословно."],["pick","выбор запуска","Orc сам выберет машину со свободным местом, модель и reasoning effort под задачу. Ошибку в таком выборе исправит перезапуск, поэтому человек в нём участвовать не будет."],["subquo","Subquo","Subquo прочитает остаток квоты на каждом аккаунте. Orc учтёт его при выборе и не отдаст задачу аккаунту, у которого квота кончается."],["run","run","Run это одно выполнение задачи, от её текста до merge. Каждый шаг run будет виден в dashboard."],["sandbox","sandbox","Агент будет работать в sandbox, в своём worktree на новом branch. Ему будут видны только файлы и сеть задачи, поэтому внутри он не будет спрашивать разрешения."],["implementer","implementer","Implementer напишет изменение и сделает коммит на branch. Если ему не хватит решения, он задаст вопрос вместо догадки. После нескольких одинаковых сбоев Orc поставит run на паузу, и сбой станет вопросом в attention queue."],["gate","review gate","Из sandbox изменение выйдет только через review gate самого Orc: проверки, ревью и CI. Слово агента о готовности ничего не решит. Проверки будут быстрыми, потому что медленная проверка задерживает всех агентов сразу."],["checks","проверки","Когда агент закончит, Orc сам запустит проверки проекта."],["fixer","fixer","Fixer получит вывод проверки, которая не прошла, и исправит изменение."],["reviewer","reviewer","Reviewer будет работать на сильной модели другого семейства, чем implementer. Замечание, которое не требует решения, будет исправлено без человека, а остальные станут вопросами в attention queue."],["pr","PR и CI","Задача будет готова, когда на branch появится новый коммит, проверки пройдут, а CI на открытом PR станет зелёным. Каждое из этих условий проверит программа."],["merge","merge","Какой зелёный PR пройдёт merge без человека, решат правила проекта. Orc сделает merge ровно того коммита, который проверил. Критичные и рискованные операции будут ждать человека при любых правилах."],["attention","attention queue","Каждый вопрос попадёт в attention queue, общую очередь вопросов к decider и к человеку. Run с открытым вопросом встанет на паузу на своём branch и продолжится после ответа."],["list","список в коде","Orc сверит каждый вопрос со списком критичных и рискованных операций в коде. Вопрос из списка пойдёт сразу к человеку, и ни одно правило не расширит то, на что отвечает decider."],["decider","decider","Decider закроет рутинные вопросы на малой модели, по правилам проекта и его владельца."],["human2","Человек","До человека дойдут только критичные и рискованные операции. Агент подготовит операцию до последнего шага и покажет, что изменится, а человек решит до неё."],["dashboard","dashboard","Dashboard будет единственным местом, куда смотрит человек. В нём будут состояние каждой задачи, причина её ожидания и каждый открытый вопрос, и заходить в сессию агента не придётся."]];let cur=-1;
const hl=document.getElementById('hl'),hlr=document.getElementById('hlr'),hots=[...document.querySelectorAll('.hot')];
function show(i){cur=i;const r=hots[i].querySelector('rect');for(const a of ['x','y','width','height'])hlr.setAttribute(a,r.getAttribute(a));hl.classList.add('on');
document.getElementById('t').textContent=N[i][1];document.getElementById('d').textContent=N[i][2];
document.getElementById('count').textContent=(i+1)+' из '+N.length;const w=document.querySelector('.wrap');if(w.scrollWidth>w.clientWidth){const hb=hots[i].getBoundingClientRect(),wb=w.getBoundingClientRect();w.scrollBy({left:hb.left+hb.width/2-(wb.left+wb.width/2),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}prev.disabled=i<=0;next.disabled=i>=N.length-1}
hots.forEach((h,i)=>{h.addEventListener('click',()=>show(i));h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
const prev=document.getElementById('prev'),next=document.getElementById('next');prev.disabled=true;
prev.onclick=()=>cur>0&&show(cur-1);next.onclick=()=>show(Math.min(cur+1,N.length-1));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
document.getElementById('count').textContent=N.length+' шагов';
</script></body></html>
