<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Где Orc останавливает агента</title>
<style>
:root{--fg:#222;--muted:#6a6a6a;--accent:#e8590c;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1260px;margin:0 auto;padding:40px 20px 0}
.grid{display:grid;grid-template-columns:minmax(720px,1fr) 340px;gap:32px;align-items:start}
.side{position:sticky;top:20px;padding-bottom:40px}
@media (max-width:1120px){.grid{display:block}.side{position:sticky;top:auto;bottom:0;background:var(--bg);border-top:2px solid #1e1e1e;padding:4px 0 12px;max-height:45vh;overflow:auto}}
h1{font-size:32px;line-height:1.2;margin:0 0 12px}
.lead{max-width:680px;margin:0 0 24px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
#scheme{display:block;width:100%;min-width:720px;height:auto}
.hot rect{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
.hot:hover rect{stroke:#adb5bd;stroke-width:2;stroke-dasharray:6 6}
.hot:focus{outline:none}
.hot:focus-visible rect{stroke:#1971c2;stroke-width:3}
#hlr{fill:none;stroke:var(--accent);stroke-width:4;opacity:0;transition:opacity .2s ease-out}
#hl.on #hlr{opacity:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
button{font:inherit;font-size:16px;padding:8px 14px;border:2px solid #1e1e1e;border-radius:10px;background:#fff;cursor:pointer;min-height:44px;touch-action:manipulation}
button:hover{background:#f1f3f5}
button:disabled{opacity:.4;cursor:default}
#count{color:var(--muted);font-size:16px;margin-left:auto}
.card{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.card h2{font-size:22px;margin:0 0 6px}
.card p{margin:0}
@media (prefers-reduced-motion:reduce){#hlr{transition:none}}
</style></head><body><main>
<h1>Где Orc останавливает агента</h1>
<p class="lead">Это путь одной задачи в Orc и места, где агент работает сам, проходит проверку или ждёт человека. Нажмите на любой элемент схемы или пройдите путь по шагам.</p>

phabetic">или правила проекта</text></g><g id="hl" aria-hidden="true"><rect id="hlr" rx="16"/></g><g id="hots"><g class="hot" data-i="0" tabindex="0" role="button" aria-label="Человек"><rect x="14" y="14" width="162" height="72" rx="14"/></g><g class="hot" data-i="1" tabindex="0" role="button" aria-label="backlog"><rect x="264" y="14" width="162" height="72" rx="14"/></g><g class="hot" data-i="2" tabindex="0" role="button" aria-label="beat"><rect x="514" y="14" width="142" height="72" rx="14"/></g><g class="hot" data-i="3" tabindex="0" role="button" aria-label="run"><rect x="14" y="144" width="1137" height="297" rx="14"/></g><g class="hot" data-i="4" tabindex="0" role="button" aria-label="sandbox"><rect x="44" y="214" width="432" height="197" rx="14"/></g><g class="hot" data-i="5" tabindex="0" role="button" aria-label="implementer"><rect x="69" y="314" width="182" height="67" rx="14"/></g><g class="hot" data-i="6" tabindex="0" role="button" aria-label="review gate"><rect x="514" y="164" width="617" height="257" rx="14"/></g><g class="hot" data-i="7" tabindex="0" role="button" aria-label="проверки"><rect x="539" y="314" width="162" height="67" rx="14"/></g><g class="hot" data-i="8" tabindex="0" role="button" aria-label="fixer"><rect x="539" y="194" width="162" height="67" rx="14"/></g><g class="hot" data-i="9" tabindex="0" role="button" aria-label="reviewer"><rect x="759" y="314" width="162" height="67" rx="14"/></g><g class="hot" data-i="10" tabindex="0" role="button" aria-label="PR и CI"><rect x="969" y="314" width="142" height="67" rx="14"/></g><g class="hot" data-i="11" tabindex="0" role="button" aria-label="attention queue"><rect x="14" y="504" width="612" height="252" rx="14"/></g><g class="hot" data-i="12" tabindex="0" role="button" aria-label="список в коде"><rect x="54" y="584" width="197" height="72" rx="14"/></g><g class="hot" data-i="13" tabindex="0" role="button" aria-label="decider"><rect x="354" y="534" width="172" height="72" rx="14"/></g><g class="ho <section class="card" aria-live="polite"><h2 id="t">С чего начать</h2><p id="d">Нажмите «Дальше», и схема поведёт задачу от первого шага.</p></section></div></div>

<script>
const N=[["human","Человек","Человек ставит задачу и даёт ей приоритет. Без приоритета задача не стартует, и это первое решение, которое остаётся за человеком."],["backlog","backlog","Backlog это единый список работы. Задача из него становится заданием агента дословно."],["beat","beat","Beat это проход по таймеру, который запускает задачи с приоритетом. Агент не выбирает себе работу сам."],["run","run","Run это одно выполнение задачи, от её текста до PR или отчёта. Orc останавливает агента, который долго молчит."],["sandbox","sandbox","Агент работает в sandbox и в своём worktree на новом branch. Ему видны только файлы и сеть задачи, поэтому внутри он не спрашивает разрешения."],["implementer","implementer","Implementer пишет изменение и делает коммит на branch. Если ему не хватает решения, он задаёт вопрос вместо догадки. Когда одна команда падает несколько раз подряд, Orc сообщает человеку, а если сбои продолжаются, ставит run на паузу с вопросом."],["gate","review gate","Из sandbox изменение выходит только через review gate: локальные проверки, ревью и CI. Слово агента о готовности ничего не решает."],["checks","проверки","Когда агент закончил, Orc сам запускает build, линтер и typecheck."],["fixer","fixer","Fixer получает вывод проверки, которая не прошла, и исправляет изменение. После нескольких неудачных исправлений run закрывается неудачей, и PR не открывается."],["reviewer","reviewer","Reviewer работает на сильной модели другого семейства, чем implementer. Замечание, которое не требует решения, исправляется без человека, а остальные становятся вопросами в attention queue."],["pr","PR и CI","Задача закрыта, когда на branch есть новый коммит, локальные проверки пройдены, а CI на открытом PR зелёный. Каждое из этих условий проверяет программа."],["attention","attention queue","Всё, что кого-то ждёт, лежит по одному пункту в attention queue, и каждый пункт называет отвечающего. Run с открытым вопросом ждёт ответа, потом встаёт на паузу на своём branch и продолжается после ответа."],["list","список в коде","Orc сверяет вопрос со списком критичных и рискованных операций в коде. Такой вопрос идёт сразу к человеку, и ни одно правило не расширяет то, на что отвечает decider."],["decider","decider","Decider закрывает рутинные вопросы на малой модели и не имеет инструментов. Он отвечает цитатой из правил владельца, инструкций проекта, задачи или прежнего ответа, а остальное передаёт человеку."],["human2","Человек","До человека доходят критичные и рискованные операции и вопросы, на которые нет правила. Любой ответ decider человек может заменить своим."],["merge","merge","Orc не делает merge PR с красной проверкой, с проверкой без результата или без проверок, и делает merge ровно того коммита, который проверил. Merge идёт по слову владельца проекта, а в проекте, где он это разрешил, зелёный PR закрытой задачи проходит без него. Критичные и рискованные операции ждут его слова в любом проекте."]];let cur=-1;
const hl=document.getElementById('hl'),hlr=document.getElementById('hlr'),hots=[...document.querySelectorAll('.hot')];
function show(i){cur=i;const r=hots[i].querySelector('rect');for(const a of ['x','y','width','height'])hlr.setAttribute(a,r.getAttribute(a));hl.classList.add('on');
document.getElementById('t').textContent=N[i][1];document.getElementById('d').textContent=N[i][2];
document.getElementById('count').textContent=(i+1)+' из '+N.length;const w=document.querySelector('.wrap');if(w.scrollWidth>w.clientWidth){const hb=hots[i].getBoundingClientRect(),wb=w.getBoundingClientRect();w.scrollBy({left:hb.left+hb.width/2-(wb.left+wb.width/2),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}prev.disabled=i<=0;next.disabled=i>=N.length-1}
hots.forEach((h,i)=>{h.addEventListener('click',()=>show(i));h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
const prev=document.getElementById('prev'),next=document.getElementById('next');prev.disabled=true;
prev.onclick=()=>cur>0&&show(cur-1);next.onclick=()=>show(Math.min(cur+1,N.length-1));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
document.getElementById('count').textContent=N.length+' шагов';
</script></body></html>
