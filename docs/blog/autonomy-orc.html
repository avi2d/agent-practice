<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь задачи в Orc</title>
<style>
:root{--fg:#222;--muted:#6a6a6a;--accent:#e8590c;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1260px;margin:0 auto;padding:40px 20px 0}
.grid{display:grid;grid-template-columns:minmax(720px,1fr) 340px;gap:32px;align-items:start}
.side{position:sticky;top:20px;padding-bottom:40px}
@media (max-width:1120px){.grid{display:block}.side{position:sticky;top:auto;bottom:0;background:var(--bg);border-top:2px solid #1e1e1e;padding:4px 0 12px;max-height:45vh;overflow:auto}}
h1{font-size:32px;line-height:1.2;margin:0 0 12px}
.lead{max-width:680px;margin:0 0 24px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
#scheme{display:block;width:100%;min-width:720px;height:auto}
.hot rect{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
.hot:hover rect{stroke:#adb5bd;stroke-width:2;stroke-dasharray:6 6}
.hot:focus{outline:none}
.hot:focus-visible rect{stroke:#1971c2;stroke-width:3}
#hlr{fill:none;stroke:var(--accent);stroke-width:4;opacity:0;transition:opacity .2s ease-out}
#hl.on #hlr{opacity:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
button{font:inherit;font-size:16px;padding:8px 14px;border:2px solid #1e1e1e;border-radius:10px;background:#fff;cursor:pointer;min-height:44px;touch-action:manipulation}
button:hover{background:#f1f3f5}
button:disabled{opacity:.4;cursor:default}
#count{color:var(--muted);font-size:16px;margin-left:auto}
.card{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.card h2{font-size:22px;margin:0 0 6px}
.card p{margin:0}
@media (prefers-reduced-motion:reduce){#hlr{transition:none}}
</style></head><body><main>
<h1>Путь задачи в Orc</h1>
<p class="lead">Это путь одной задачи в Orc: что Orc выбирает сам, где агент работает без запросов разрешения и что доходит до человека. Нажмите на любой элемент схемы или пройдите путь по шагам.</p>

<script>
const N=[["human","Человек","Человек описывает задачу словами. Машину, модель и reasoning effort он не выбирает."],["env","изолированная среда","Система агентов работает на машинах агентов, и каждая из них это своя изолированная среда: отдельная Linux-система без прав администратора и без доступа к диску машины человека. На машине человека остаются только задачи, которым она нужна, например работа с симулятором телефона и демонстрации, и каждая из них работает в sandbox. Каждую правку файлов в среде можно выбросить вместе с branch. Push в main останавливает защита main на хостинге репозиториев, правку настроек CI не пропускает токен агентов, а запись на адрес не из списка задачи не выпускает сеть среды, поэтому внутри агент не спрашивает разрешения."],["backlog","backlog","Задача попадает в backlog, единый список работы, и становится заданием агента дословно."],["pick","выбор запуска","Orc сам выбирает машину со свободным местом, модель и reasoning effort под задачу. Ошибку в таком выборе исправляет перезапуск, поэтому человек в нём не участвует."],["subquo","Subquo","Subquo читает остаток квоты на каждом аккаунте. Orc учитывает его при выборе и не отдаёт задачу аккаунту, у которого квота кончается."],["run","run","Run это одно выполнение задачи, от её текста до merge. Каждый шаг run виден в dashboard."],["implementer","implementer","Implementer пишет изменение в своём worktree и делает коммит на новый branch. Если ему не хватает решения, он задаёт вопрос вместо догадки. После нескольких одинаковых сбоев Orc ставит run на паузу, и сбой становится вопросом в attention queue."],["gate","review gate","Изменение выходит из run только через review gate самого Orc: проверки, ревью и CI. Слово агента о готовности ничего не решает. Проверки идут быстро, потому что медленная проверка задерживает всех агентов сразу."],["checks","проверки","Когда агент заканчивает, Orc сам запускает проверки проекта."],["fixer","fixer","Fixer получает вывод проверки, которая не прошла, и исправляет изменение."],["reviewer","reviewer","Reviewer работает на сильной модели другого семейства, чем implementer. Замечание, которое не требует решения, исправляется без человека, а остальные становятся вопросами в attention queue."],["pr","PR и CI","Задача готова, когда на branch есть новый коммит, проверки прошли, а CI на открытом PR зелёный. Каждое из этих условий проверяет программа."],["merge","merge","Зелёный PR проходит merge по правилам проекта. Orc делает merge ровно того коммита, который проверил. Критичные и рискованные операции и вопросы без правила проекта ждут человека."],["main","защищённый main","Main защищён на хостинге репозиториев. Push в main и merge в обход правил проекта хостинг останавливает, что бы агент ни прочитал."],["attention","attention queue","Каждый вопрос попадает в attention queue, общую очередь вопросов к decider и к человеку. Run с открытым вопросом встаёт на паузу на своём branch и продолжается после ответа."],["list","список в коде","Orc сверяет каждый вопрос со списком критичных и рискованных операций в коде. Вопрос из списка идёт сразу к человеку, и ни одно правило не расширяет то, на что отвечает decider."],["decider","decider","Decider отвечает на малой модели только на вопросы, которые покрывают правила проекта и его владельца. Вопрос без правила он передаёт человеку."],["human2","Человек","До человека доходят критичные и рискованные операции из списка в коде и вопросы без правила проекта. Агент готовит операцию до последнего шага и показывает, что изменится, а человек решает до неё."],["dashboard","dashboard","Dashboard это единственное место, куда смотрит человек. В нём видны состояние каждой задачи, причина её ожидания и каждый открытый вопрос, и заходить в сессию агента не нужно."]];let cur=-1;
const hl=document.getElementById('hl'),hlr=document.getElementById('hlr'),hots=[...document.querySelectorAll('.hot')];
function show(i){cur=i;const r=hots[i].querySelector('rect');for(const a of ['x','y','width','height'])hlr.setAttribute(a,r.getAttribute(a));hl.classList.add('on');
document.getElementById('t').textContent=N[i][1];document.getElementById('d').textContent=N[i][2];
document.getElementById('count').textContent=(i+1)+' из '+N.length;const w=document.querySelector('.wrap'),behavior=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',hb=hots[i].getBoundingClientRect();if(w.scrollWidth>w.clientWidth){const wb=w.getBoundingClientRect();w.scrollBy({left:hb.left+hb.width/2-(wb.left+wb.width/2),behavior})}const side=document.querySelector('.side'),free=getComputedStyle(side.parentElement).display==='block'?side.getBoundingClientRect().top:innerHeight;if(hb.top<0||hb.bottom>free)scrollBy({top:hb.top+hb.height/2-free/2,behavior});prev.disabled=i<=0;next.disabled=i>=N.length-1}
hots.forEach((h,i)=>{h.addEventListener('click',()=>show(i));h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
const prev=document.getElementById('prev'),next=document.getElementById('next');prev.disabled=true;
prev.onclick=()=>cur>0&&show(cur-1);next.onclick=()=>show(Math.min(cur+1,N.length-1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
document.getElementById('count').textContent=N.length+' шагов';
</script></body></html>
