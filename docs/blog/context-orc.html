<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сжатие и передача в Orc</title>
<style>
:root{color-scheme:light;--fg:#222;--muted:#606060;--accent:#e8590c;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1260px;margin:auto;padding:40px 20px}
h1{font-size:32px;line-height:1.2;margin:0 0 12px}
.lead{max-width:680px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.wrap{overflow-x:auto;border-radius:12px}
#scheme{display:block;width:100%;min-width:720px;height:auto}
.hot rect{fill:transparent;stroke:transparent;pointer-events:all;cursor:pointer}
.hot:focus-visible rect{stroke:#1971c2;stroke-width:3}
.hot:active rect{fill:#e7f5ff;fill-opacity:.4}
#highlight{fill:none;stroke:var(--accent);stroke-width:4;pointer-events:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
button{font:inherit;font-size:16px;padding:8px 14px;border:2px solid #1e1e1e;border-radius:10px;background:#fff;cursor:pointer;min-height:44px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:3px solid #1971c2;outline-offset:3px}
button:active{background:#dee2e6}
button:disabled{opacity:.4;cursor:default}
.hot{touch-action:manipulation}
#count{color:var(--muted);font-size:16px;margin-left:auto}
.card{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.card h2{font-size:22px;margin:0 0 6px}
.card p{margin:0}

a{color:#1864ab}
@media (hover:hover) and (pointer:fine){button:hover{background:#f1f3f5}.hot:hover rect{stroke:#868e96;stroke-width:2;stroke-dasharray:6 6}}
@media (max-width:1000px){.grid{display:block}.side{margin-top:20px}}
</style>
</head>
<body>
<main>
<h1>Сжатие и передача в Orc</h1>

<div class="side">
<div class="bar">
<button id="prev" type="button" disabled>← Назад</button>
<button id="next" type="button">Дальше →</button>
<span id="count">1 из 5</span>
</div>
<section class="card" aria-live="polite" aria-atomic="true">
<h2 id="title">Сессия</h2>
<p id="description">Orc считает ходы и сжатия в каждой сессии. Ход включает ответ модели и её действия.</p>

</main>
<script>
const steps=[{"title":"Сессия","description":"Orc считает ходы и сжатия в каждой сессии. Ход включает ответ модели и её действия."},{"title":"Сжатие","description":"Агентная программа сжимает историю, когда свободного места остаётся мало. Старую часть истории заменяет краткая запись, а последние ходы остаются без изменений."},{"title":"Порог передачи","description":"На 300 ходах или пятом сжатии Orc останавливает сессию и записывает handover.md."},{"title":"handover.md","description":"В записи остаются сделанные коммиты и причина остановки."},{"title":"Следующий запуск","description":"Следующий запуск на том же branch продолжает с handover.md, а не со сжатой истории."}];
const hotspots=[...document.querySelectorAll('.hot')];
const highlight=document.getElementById('highlight');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
let current=0;
function show(index){
  current=index;
  const selected=hotspots[index];
  const rect=selected.querySelector('rect');
  for(const name of ['x','y','width','height'])highlight.setAttribute(name,rect.getAttribute(name));
  hotspots.forEach((hotspot,i)=>hotspot.setAttribute('aria-pressed',String(i===index)));
  document.getElementById('title').textContent=steps[index].title;
  document.getElementById('description').textContent=steps[index].description;
  document.getElementById('count').textContent=(index+1)+' из '+steps.length;
  prev.disabled=index===0;
  next.disabled=index===steps.length-1;
  const wrap=document.querySelector('.wrap');
  const target=selected.getBoundingClientRect();
  const viewport=wrap.getBoundingClientRect();
  if(wrap.scrollWidth>wrap.clientWidth)wrap.scrollBy({left:target.left+target.width/2-viewport.left-viewport.width/2,behavior:'instant'});
}
hotspots.forEach((hotspot,index)=>{
  hotspot.addEventListener('click',()=>show(index));
  hotspot.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();show(index)}
  });
});
prev.addEventListener('click',()=>{if(current>0)show(current-1)});
next.addEventListener('click',()=>{if(current<steps.length-1)show(current+1)});
show(0);
</script>
