<title>Как Orc держит секреты и сеть</title>
<style>
:root{--fg:#222;--muted:#6a6a6a;--accent:#e8590c;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1260px;margin:0 auto;padding:40px 20px 0}
.grid{display:grid;grid-template-columns:minmax(720px,1fr) 340px;gap:32px;align-items:start}
.side{position:sticky;top:20px;padding-bottom:40px}
@media (max-width:1120px){.grid{display:block}.side{position:sticky;top:auto;bottom:0;background:var(--bg);border-top:2px solid #1e1e1e;padding:4px 0 12px;max-height:45vh;overflow:auto}}
h1{font-size:32px;line-height:1.2;margin:0 0 12px}
.lead{max-width:680px;margin:0 0 24px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
#scheme{display:block;width:100%;min-width:720px;height:auto}
.hot rect{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
.hot:hover rect{stroke:#adb5bd;stroke-width:2;stroke-dasharray:6 6}
.hot:focus{outline:none}
.hot:focus-visible rect{stroke:#1971c2;stroke-width:3}
#hlr{fill:none;stroke:var(--accent);stroke-width:4;opacity:0;transition:opacity .2s ease-out}
#hl.on #hlr{opacity:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
button{font:inherit;font-size:16px;padding:8px 14px;border:2px solid #1e1e1e;border-radius:10px;background:#fff;cursor:pointer;min-height:44px;touch-action:manipulation}
button:hover{background:#f1f3f5}
button:disabled{opacity:.4;cursor:default}
#count{color:var(--muted);font-size:16px;margin-left:auto}
.card{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.card h2{font-size:22px;margin:0 0 6px}
.card p{margin:0}
@media (prefers-reduced-motion:reduce){#hlr{transition:none}}
</style></head><body><main>
<h1>Как Orc держит секреты и сеть</h1>
<p class="lead">Это путь одной задачи в Orc и места, где держатся секреты, сеть и граница sandbox. Нажмите на любой элемент схемы или пройдите путь по шагам.</p>

<section class="card" aria-live="polite"><h2 id="t">С чего начать</h2><p id="d">Нажмите «Дальше», и схема поведёт задачу от первого шага.</p></section></div></div>

<script>
const N=[["human","Человек","Человек ставит задачу словами. Секреты он в задачу не пишет: они лежат там, куда агент не достаёт."],["backlog","backlog","Backlog это единый список работы. Задача называет адреса и доступы, которые ей нужны, и других, кроме модели, у неё не будет."],["runner","runner","Runner запускает задачу на машине. Он стартует её с пустым окружением, поэтому переменные окружения и логины человека в sandbox не попадают."],["secrets","секреты","Секреты остаются снаружи sandbox. Доступ выдаётся на ресурс и на срок задачи и отзывается с её концом."],["sandbox","sandbox","Агент работает в sandbox и в своём worktree. Ему видны только файлы задачи, а в сеть ведёт один выход, через proxy."],["probe","проба","Перед работой проба изнутри sandbox читает подставной ключ и обращается к чужому адресу. Оба запроса должны получить отказ, а запрос к адресу из списка должен пройти, иначе задача не стартует."],["implementer","implementer","Implementer пишет изменение и читает чужой текст: issue, документацию, вывод команд. Что бы он ни прочитал, его доступ не меняется."],["worktree","worktree","Всё, что сделал агент, лежит в worktree на своём branch. Обманутому агенту остаются этот worktree, действия токена задачи через proxy и адреса из её списка, и ничего больше."],["proxy","proxy","Proxy стоит снаружи sandbox. Он подставляет ключ в запрос и возвращает агенту только ответ, поэтому значение ключа не попадает в контекст и в лог сессии."],["model","модель","Запрос к модели тоже идёт через proxy, и ключ аккаунта агенту не виден."],["allowed","адрес из списка","Proxy пропускает запрос только к модели и к адресам, которые назвала задача."],["foreign","чужой адрес","Запрос на любой другой адрес получает отказ, и прочитанное на него не уйдёт."],["gate","review gate","Из sandbox изменение выходит через review gate: локальные проверки, независимое ревью и CI на открытом PR."],["pr","PR","В PR видно всё, что изменил агент. Изменение секретов, прав и настроек CI заметно в нём до merge."],["attention","attention queue","Запрос на смену границы становится вопросом в attention queue. Decider, малая модель для рутинных вопросов, на такой вопрос не отвечает."],["human2","Человек","Новый адрес в списке, новый секрет и новые права выдаёт только человек."],["merge","merge","Какой зелёный PR проходит merge без человека, решают правила проекта. Изменение, которое двигает границу, ждёт человека при любых правилах."]];let cur=-1;
const hl=document.getElementById('hl'),hlr=document.getElementById('hlr'),hots=[...document.querySelectorAll('.hot')];
function show(i){cur=i;const r=hots[i].querySelector('rect');for(const a of ['x','y','width','height'])hlr.setAttribute(a,r.getAttribute(a));hl.classList.add('on');
document.getElementById('t').textContent=N[i][1];document.getElementById('d').textContent=N[i][2];
document.getElementById('count').textContent=(i+1)+' из '+N.length;const w=document.querySelector('.wrap');if(w.scrollWidth>w.clientWidth){const hb=hots[i].getBoundingClientRect(),wb=w.getBoundingClientRect();w.scrollBy({left:hb.left+hb.width/2-(wb.left+wb.width/2),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}prev.disabled=i<=0;next.disabled=i>=N.length-1}
hots.forEach((h,i)=>{h.addEventListener('click',()=>show(i));h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
const prev=document.getElementById('prev'),next=document.getElementById('next');prev.disabled=true;
prev.onclick=()=>cur>0&&show(cur-1);next.onclick=()=>show(Math.min(cur+1,N.length-1));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
document.getElementById('count').textContent=N.length+' шагов';
</script></body></html>
