<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 300" role="img"><title>Путь инструкции от Body через Hub и Dispatcher к разговору модели, с журналом и сравнением</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="220" y1="85" x2="270" y2="85" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="470" y1="85" x2="520" y2="85" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="720" y1="85" x2="770" y2="85" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
