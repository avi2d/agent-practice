<text x="120.0" y="85.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#1e1e1e">Body в библиотеке</text>
<rect x="270" y="50" width="200" height="70" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="370.0" y="85.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#1e1e1e">Hub с ссылками</text>
<rect x="520" y="50" width="200" height="70" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="620.0" y="85.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#1e1e1e">Dispatcher по условию</text>
<rect x="770" y="50" width="200" height="70" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
