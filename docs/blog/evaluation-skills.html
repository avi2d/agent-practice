<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как skills оценивает Rule</title>
<style>
:root{--fg:#222;--muted:#6a6a6a;--accent:#e8590c;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1260px;margin:0 auto;padding:40px 20px 0}
.grid{display:grid;grid-template-columns:minmax(720px,1fr) 340px;gap:32px;align-items:start}
.side{position:sticky;top:20px;padding-bottom:40px}
@media (max-width:1120px){.grid{display:block}.side{position:sticky;top:auto;bottom:0;background:var(--bg);border-top:2px solid #1e1e1e;padding:4px 0 12px;max-height:45vh;overflow:auto}}
h1{font-size:32px;line-height:1.2;margin:0 0 12px}
.lead{max-width:680px;margin:0 0 24px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
#scheme{display:block;width:100%;min-width:720px;height:auto}
.hot rect{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
.hot:hover rect{stroke:#adb5bd;stroke-width:2;stroke-dasharray:6 6}
.hot:focus{outline:none}
.hot:focus-visible rect{stroke:#1971c2;stroke-width:3}
#hlr{fill:none;stroke:var(--accent);stroke-width:4;opacity:0;transition:opacity .2s ease-out}
#hl.on #hlr{opacity:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
button{font:inherit;font-size:16px;padding:8px 14px;border:2px solid #1e1e1e;border-radius:10px;background:#fff;cursor:pointer;min-height:44px;touch-action:manipulation}
button:hover{background:#f1f3f5}
button:disabled{opacity:.4;cursor:default}
#count{color:var(--muted);font-size:16px;margin-left:auto}
.card{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.card h2{font-size:22px;margin:0 0 6px}
.card p{margin:0}
@media (prefers-reduced-motion:reduce){#hlr{transition:none}}
</style></head><body><main>
<h1>Как skills оценивает Rule</h1>
<p class="lead">Это путь одного Rule в skills, моей библиотеке инструкций для агентов, от сбоя в работе до модели, которая его получает. Нажмите на любой элемент схемы или пройдите путь по шагам.</p>

-30.64 0.52, -60 0.93, -89 0" stroke="#1e1e1e" stroke-width="2" fill="none"></path></g><g transform="translate(339.5 562.5) rotate(0 -44.5 0)"><path d="M-65.35 -8.09 C-72.08 -4.48, -76.81 -5.84, -89 0 M-65.35 -8.09 C-73.99 -4.93, -81.37 -1.8, -89 0" stroke="#1e1e1e" stroke-width="2" fill="none"></path></g><g transform="translate(339.5 562.5) rotate(0 -44.5 0)"><path d="M-65.68 9.01 C-72.25 9.17, -76.91 4.38, -89 0 M-65.68 9.01 C-74.25 6.41, -81.52 3.8, -89 0" stroke="#1e1e1e" stroke-width="2" fill="none"></path></g></g><mask></mask><g id="hl" aria-hidden="true"><rect id="hlr" rx="16"/></g><g id="hots"><g class="hot" data-i="0" tabindex="0" role="button" aria-label="сбой в работе"><rect x="44" y="14" width="202" height="72" rx="14"/></g><g class="hot" data-i="1" tabindex="0" role="button" aria-label="Rule"><rect x="344" y="14" width="202" height="72" rx="14"/></g><g class="hot" data-i="2" tabindex="0" role="button" aria-label="case для правки"><rect x="624" y="14" width="222" height="72" rx="14"/></g><g class="hot" data-i="3" tabindex="0" role="button" aria-label="case для итога"><rect x="624" y="99" width="222" height="72" rx="14"/></g><g class="hot" data-i="4" tabindex="0" role="button" aria-label="sweep"><rect x="14" y="234" width="1142" height="272" rx="14"/></g><g class="hot" data-i="5" tabindex="0" role="button" aria-label="с Rule"><rect x="44" y="279" width="202" height="67" rx="14"/></g><g class="hot" data-i="6" tabindex="0" role="button" aria-label="без Rule"><rect x="44" y="394" width="202" height="67" rx="14"/></g><g class="hot" data-i="7" tabindex="0" role="button" aria-label="агент ×5"><rect x="344" y="334" width="202" height="72" rx="14"/></g><g class="hot" data-i="8" tabindex="0" role="button" aria-label="judge"><rect x="624" y="334" width="222" height="72" rx="14"/></g><g class="hot" data-i="9" tabindex="0" role="button" aria-label="hidden verifier"><rect x="624" y="424" width="222" height="62" rx="14"/></g><g class="hot" data-i="10" tabindex="0" role="button" aria-label="record"><rect x="914" y="334" width="212" height="72" rx="14"/></g><g class="hot" data-i="11" tabindex="0" role="button" aria-label="таблица"><rect x="914" y="574" width="212" height="72" rx="14"/></g><g class="hot" data-i="12" tabindex="0" role="button" aria-label="Profile"><rect x="624" y="574" width="222" height="72" rx="14"/></g><g class="hot" data-i="13" tabindex="0" role="button" aria-label="включён"><rect x="344" y="529" width="202" height="67" rx="14"/></g><g class="hot" data-i="14" tabindex="0" role="button" aria-label="выключен"><rect x="344" y="624" width="202" height="67" rx="14"/></g><g class="hot" data-i="15" tabindex="0" role="button" aria-label="агент в работе"><rect x="44" y="529" width="202" height="67" rx="14"/></g><g class="hot" data-i="16" tabindex="0" role="button" aria-label="новая модель"><rect x="914" y="14" width="212" height="72" rx="14"/></g></g></svg></div>

<section class="card" aria-live="polite"><h2 id="t">С чего начать</h2><p id="d">Нажмите «Дальше», и схема поведёт Rule от первого шага.</p></section></div></div>

<script>
const N=[["fail","сбой в работе","Rule начинается со сбоя, который агент допустил в настоящей работе, например прочитал в контекст лог целиком. Сбой даёт и текст Rule, и задачи, на которых Rule измеряют."],["rule","Rule","Rule это инструкция, которую программа доставляет агенту, когда срабатывает её триггер. Rule остаётся включённым, пока оценка показывает прирост."],["tune","case для правки","Case это задача оценки: исходные файлы небольшого репозитория, поручение и judge. Без Rule агент ошибается в ней так же, как в настоящей работе. На case для правки текст Rule меняют, пока агент не начнёт ему следовать."],["final","case для итога","Итог считают на case, которые при правке текста не использовали. Поэтому прирост на них не объясняется подгонкой Rule под задачу."],["sweep","sweep","Sweep это один прогон оценки. Он проводит каждый case для итога в двух вариантах, с Rule и без него, по нескольку раз в каждом."],["with","с Rule","В этом варианте агент получает текст Rule теми же словами и в том же месте, что и в настоящей сессии."],["without","без Rule","В этом варианте Rule нет, а всё остальное то же: модель, reasoning effort, задача и среда."],["agent","агент ×5","Каждый запуск идёт в sandbox со своим репозиторием и средой, собранной с нуля. Другие Rule и настройки человека туда не попадают, поэтому между вариантами отличается только Rule."],["judge","judge","Judge это программа, которая читает лог запуска, изменённые файлы и коммиты и выносит вердикт. Запуск, который оборвался или не дошёл до задачи, остаётся без вердикта и в долю успеха не входит. Каждый judge проверен тестом, в котором он отказывает плохому результату и пропускает хороший."],["verifier","hidden verifier","Hidden verifier это скрытые тесты, которые написаны по условию задачи и показывают, решена ли она верно. Они попадают в sandbox после того, как агент закончил. Тест подтверждает, что они падают на неисправленном коде и на правдоподобном неверном исправлении."],["record","record","Record это запись, которую оставляет sweep: модель, reasoning effort, число повторов, коммит, хеш текста каждого Rule и вердикт каждого запуска с основанием, расходом токенов, ценой и числом шагов. Record попадает в репозиторий и больше не меняется."],["table","таблица","Таблицу собирает из record программа: доля успеха в каждом варианте, разница и её статистическая значимость по каждому Rule и case. Тест падает, когда таблица расходится с record."],["profile","Profile","Profile называет модели и Rule, которые эти модели получают. Rule входит в Profile той модели, на которой sweep показал прирост."],["on","включён","Включённый Rule доходит до агента по триггеру в каждой сессии на этой модели."],["off","выключен","Rule без прироста выключается и перестаёт занимать контекст. Проект может включить его у себя."],["work","агент в работе","Агент получает только те Rule, которые дали прирост на его модели."],["model","новая модель","Новая модель проходит те же case с каждым Rule и без него. Пока модель не меняется, sweep перемеряет тот Rule, который на ней дольше всех не измеряли."]];let cur=-1;
const hl=document.getElementById('hl'),hlr=document.getElementById('hlr'),hots=[...document.querySelectorAll('.hot')];
function show(i){cur=i;const r=hots[i].querySelector('rect');for(const a of ['x','y','width','height'])hlr.setAttribute(a,r.getAttribute(a));hl.classList.add('on');
document.getElementById('t').textContent=N[i][1];document.getElementById('d').textContent=N[i][2];
document.getElementById('count').textContent=(i+1)+' из '+N.length;const w=document.querySelector('.wrap');if(w.scrollWidth>w.clientWidth){const hb=hots[i].getBoundingClientRect(),wb=w.getBoundingClientRect();w.scrollBy({left:hb.left+hb.width/2-(wb.left+wb.width/2),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}prev.disabled=i<=0;next.disabled=i>=N.length-1}
hots.forEach((h,i)=>{h.addEventListener('click',()=>show(i));h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
const prev=document.getElementById('prev'),next=document.getElementById('next');prev.disabled=true;
prev.onclick=()=>cur>0&&show(cur-1);next.onclick=()=>show(Math.min(cur+1,N.length-1));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
document.getElementById('count').textContent=N.length+' шагов';
</script></body></html>
